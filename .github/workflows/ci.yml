name: PrismTranscode checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test -v ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-test-evidence
          path: |
            playwright-report/
            artifacts/*.png
  windows-media:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and prepare native test engine
        shell: pwsh
        run: |
          ./scripts/install-test-engine.ps1
          (Get-ChildItem .cache/ffmpeg-test -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: go build -trimpath -buildvcs=false -o artifacts/PrismTranscode-console.exe .
      - run: python scripts/smoke_test.py --binary artifacts/PrismTranscode-console.exe --work .cache/ci-smoke --report artifacts/windows-smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-media-test-evidence
          path: artifacts/windows-smoke-report.json
